[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agenticai-web-demo"
version = "0.1.0"
description = "Reusable website-agent demos with shared browser, storage, rules, and event tools."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
agentic-demo = "agentic_web_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_web_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
